# This package is also the workspace root so the secrets and media-framing
# crates stay independently consumable. Patches below apply workspace-wide.
[workspace]
members = ["faculties-migrations", "faculties-secrets", "framed-stream"]
resolver = "2"

[package]
name = "faculties"
version = "0.20.2"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "An office suite for AI agents: kanban, wiki, files, messaging, and a GORBIE-backed viewer — all persisted in a TribleSpace pile."
authors = ["Jan-Paul Bultmann <jp@bultmann.eu>"]
homepage = "https://github.com/erlkonig-ai/faculties"
repository = "https://github.com/erlkonig-ai/faculties"
readme = "README.md"
keywords = ["triblespace", "ai-agent", "kanban", "wiki", "notebook"]
categories = ["command-line-utilities", "data-structures"]

# docs.rs should render all public API, including the optional
# `widgets` module (WikiViewer / CompassBoard / etc.) that depends
# on egui/GORBIE.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
path = "src/lib.rs"

# GORBIE-backed viewer binary. Requires the `widgets` feature.
[[bin]]
name = "viewer"
path = "src/bin/viewer.rs"
required-features = ["widgets"]

# Minimal headless capture target for iterating on planner-widget
# visuals in isolation. It was needed because the wiki widget opened its
# own cubecl `WgpuDevice`, which collided with the headless wgpu renderer
# on some platforms; that device is gone — the graph layout runs on the
# CPU in `GORBIE::graph` — so the collision it works around no longer
# exists. Kept because iterating on one widget is still faster than
# rendering the whole notebook.
[[bin]]
name = "planner-capture"
path = "src/bin/planner-capture.rs"
required-features = ["widgets"]

# Same idea for the headspace widget — minimal capture target that
# skips the wiki widget's GPU init so headless captures of the
# agent-config card don't get truncated.
[[bin]]
name = "headspace-capture"
path = "src/bin/headspace-capture.rs"
required-features = ["widgets"]

# Memory chunks viewer — recent compacted-context summaries.
[[bin]]
name = "memory-capture"
path = "src/bin/memory-capture.rs"
required-features = ["widgets"]

# Gauge research-health dashboard.
[[bin]]
name = "gauge-capture"
path = "src/bin/gauge-capture.rs"
required-features = ["widgets"]

# Messages-only viewer.
[[bin]]
name = "messages-capture"
path = "src/bin/messages-capture.rs"
required-features = ["widgets"]

# Files import-history viewer.
[[bin]]
name = "files-capture"
path = "src/bin/files-capture.rs"
required-features = ["widgets"]

# Triage diagnostic viewer.
[[bin]]
name = "triage-capture"
path = "src/bin/triage-capture.rs"
required-features = ["widgets"]

# Atlas schema-catalog browser.
[[bin]]
name = "atlas-capture"
path = "src/bin/atlas-capture.rs"
required-features = ["widgets"]

# Discord recent-messages viewer.
[[bin]]
name = "discord-capture"
path = "src/bin/discord-capture.rs"
required-features = ["widgets"]

# Teams recent-messages viewer.
[[bin]]
name = "teams-capture"
path = "src/bin/teams-capture.rs"
required-features = ["widgets"]

# Window-status board viewer.
[[bin]]
name = "status-capture"
path = "src/bin/status-capture.rs"
required-features = ["widgets"]

[features]
# `local-embed` and `widgets` are default: semantic recall is core to knowledge
# workflows, and the GORBIE viewer is part of the normal office surface.
# A stock workspace cohort build (`cargo build --release --workspace --bins`)
# must ship both.
default = ["local-embed", "widgets", "audio", "hear"]
# GORBIE-backed viewers for faculty branches. Enables the `widgets` module.
widgets = [
    "dep:GORBIE",
    "dep:egui",
]
# Consumed by GORBIE's `#[notebook]` expansion to gate its export branch.
web-export = []
# Semantic similarity in `files` + `wiki similar` / `memory similar` (image+text
# embeddings via mary's embedder). Default (see above).
local-embed = ["dep:mary", "mary/embed", "mary/gemma", "triblespace-search/semantic"]
# Text-to-image generation via mary's ported FLUX.2 pipeline (Burn/Metal).
imagine = ["dep:mary", "mary/flux"]
# In-process Qwen3-TTS in the `voice` faculty (`voice say`/`voice shout`/`voice
# stream`) via mary's ported Burn pipeline. One resident `mary::speak::Synthesizer`
# is retained by each Voice frontend instance, so a stream or MCP server loads
# its selected cohort once instead of paying model startup per utterance. There
# is no separately-built speech binary that can drift stale against the pile
# format (the staleness class that truncated memory on 2026-06-30). Four explicit
# roots are selected from one frozen native model-collection pile
# (`QWEN3TTS_PILE`): exact base, shared codec, filtered f16 talker, and folded
# f16 talker.
# Native audio device enumeration + playback sink (rodio/cpal). Default so
# stock installs keep `voice devices`/routing; excluded on audio-less servers
# (FreeBSD build class, 2026-07-21) via --no-default-features.
audio = ["dep:rodio"]
voice = ["dep:mary", "mary/speak", "audio"]
# The `hear` faculty: Soma's framed microphone -> energy VAD -> Gemma-4 audio
# tower + multimodal embedder, handing over EMBEDDINGS (not text). `mary/gemma`
# brings the parity-gated audio path; `tokenizers` is the decoder's BPE, needed
# to build the `Hearing` handle even when only `embed` is called. DEFAULT: it
# replaces `converse` as the shipping ear surface, and `local-embed` (also
# default) already pays for `mary/gemma`, so the marginal cost is the
# tokenizer. Capture itself is `soma-client`, which is unconditional and tiny.
hear = ["dep:mary", "mary/gemma", "dep:tokenizers"]
# The `duplex` faculty: a continuously running spoken channel on mary's
# streaming full-duplex speech model. `mary/personaplex` brings the LM layers
# (it rides the same layer stack as `speak`), `mary/q4` the 4-bit temporal
# stack and the streaming codec. `audio` supplies the named-device PLAYBACK
# plumbing only — the microphone is Soma's, reached through `soma-client`
# (unconditional and tiny), which is what lets `hear` and `duplex` run at the
# same time off one device. Off by default: the model runtime is heavy and only
# this one binary needs it. NOT YET REALTIME on the measured hardware — see the
# frame-budget section of the binary's module docs before relying on it.
duplex = ["dep:mary", "mary/personaplex", "mary/q4", "audio"]
[dependencies]
# Core: every CLI faculty depends on these.
anyhow = "1.0"
clap = { version = "4.5.4", features = ["derive", "env"] }
ed25519-dalek = "2.1.1"
hifitime = "4.2.3"
rand_core = "0.6.4"
triblespace = { version = "0.47", path = "../triblespace-rs" }
triblespace-paths = { version = "0.47.0", path = "../triblespace-rs/triblespace-paths" }
triblespace-search = { version = "0.47.0", path = "../triblespace-rs/triblespace-search" }
triblespace-net = { path = "../triblespace-rs/triblespace-net" }
iroh-base = "1.0"
iroh-tickets = "1.0"
iroh = "1.0"  # CLI output to Drive's existing organ endpoint
framed-stream = { path = "framed-stream" }  # native ordered media framing
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "net", "sync", "signal", "macros"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }  # native MCP HTTP transport
faculties-secrets = { version = "0.1.0", path = "faculties-secrets" }  # secrets faculty logic

# Per-faculty dependencies shared by library operations and explicit frontends.
anybytes = "0.20"           # files
base64 = "0.22"             # teams
blake3 = "1"                # mail (deterministic entity id from Message-Id)
chrono = { version = "0.4.39", features = ["clock"] }  # orient
comemo = "0.5.1"            # wiki
ctrlc = "3.5"               # body (graceful close for kept touch loops)
dirs = "5"                  # wiki
hex = "0.4"                 # gauge
zeroize = "1.9"             # secrets CLI plaintext lifetime
humantime = "2.3.0"         # orient, patience
pollster = "0.4"            # explicit blocking boundary for local CLI/UI collection maintenance
ical = "0.11"               # planner
itertools = "0.14"          # wiki
kamadak-exif = "0.6"        # posture (EXIF/TIFF tags on images)
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "rustls-tls", "builder"] }  # mail (SMTP send)
libc = "0.2"                # teams
lopdf = { version = "0.44", default-features = false }  # posture (PDF objects + content streams)
mailparse = "0.16"          # mail (RFC 5322 parser)
memchr = "2"                # archive (bounded streaming rollout prefilter)
mime = "0.3"                # shared canonical file media-type parsing
zmij = "1"                  # archive (canonical JSON float spelling)
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }  # mail POP transport
rustls-native-certs = "0.8" # mail POP transport (platform trust roots)
quick-xml = "0.37"          # posture (OOXML part parsing)
rayon = "1.10"              # archive
syn = { version = "2", features = ["full"] }  # code (Rust declaration extraction; `full` is what makes Item/File exist)
proc-macro2 = { version = "1", features = ["span-locations"] }         # code (declaration spans; span-locations is load-bearing)
quote = "1"                 # code (ToTokens for the item token-normalization law)
regex = "1"                 # wiki
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json", "multipart"] }  # discord, files, teams, web, body, voice
rodio = { version = "0.22", default-features = false, features = ["playback"], optional = true }  # audio feature (NATIVE cpal device enumeration + playback sink; no afplay/ffplay/SwitchAudioSource subprocesses)
soma-client = { version = "0.1.0", path = "../soma/soma-client" }  # hear + duplex capture and voice playback (shared Soma wire/HTTP contracts). Unconditional: this is how the body is reached.
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }  # discord: the gateway session of `discord live`
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }  # discord: the gateway session of `discord live`
tokenizers = { version = "0.21", optional = true }  # hear (Gemma-4 BPE, needed to build the Hearing handle)
rrule = "0.14"              # planner
serde = { version = "1", features = ["derive"] }  # discord, teams, triage, web
serde_json = "1"            # discord, teams, triage, web
toml = "0.8"                # self.toml, the one external plaintext configuration
tracing = "0.1"             # archive
tracing-subscriber = { version = "0.3", features = ["env-filter"] }  # archive
typst = "0.14"              # wiki
typst-syntax = "0.14"       # wiki
zip = { version = "2", default-features = false, features = ["deflate"] }  # posture (OOXML is a zip of XML)

# Widgets-only (optional): GORBIE viewer stack.
GORBIE = { version = "0.18.1", default-features = false, features = ["typst", "markdown"], optional = true }
egui = { version = "0.34", optional = true }

# Optional, heavy: mary's Burn/Metal model ports. Activated as a bare optional
# dep (no default features); the *consuming* faculties feature turns on exactly
# the mary features it needs, so each build stays as lean as its job allows:
#   local-embed → mary[embed,gemma]: CLIP/SigLIP multi-modal embedder (CLIP
#                 image+text shared space) + nomic-embed-multimodal-7b (3584-d
#                 dense image/text space; Qwen2.5-VL port + Metal/wgpu backend).
#   imagine     → mary[flux]: the ported FLUX.2 text→image pipeline.
mary = { path = "../mary", default-features = false, optional = true }
# Files presentation codecs; also matches the image type returned by Mary FLUX.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "gif", "webp", "tiff"] } # files view; imagine

[dev-dependencies]
tempfile = "3"

# ── patches ────────────────────────────────────────────────────────────────
# `[patch]` only takes effect from the *root* crate of a build, so mary's own
# patch section is ignored when mary is consumed as a path dep here. We mirror
# it: the nomic-mm7b zero-copy aliasing path (`local-embed`) and resident CUDA
# speech need the CubeCL graph fork (external aliases plus captured/replayed
# launches), while V3 uses the 256-byte-aligned local triblespace-core. The
# whole suite is on one CubeCL lineage (0.10): widgets, Mary's model ports, and
# these fork patches all resolve together — widgets, local-embed, imagine, and
# voice are co-buildable in one release cohort.
[patch.crates-io]
# Section freezes are immutable views, not durability barriers. Keep the same
# AnyBytes lineage at every build root; dependency patch tables are ignored.
anybytes = { git = "https://github.com/triblespace/anybytes.git", rev = "066c32a7cfcc470a6750c849499c1e88a0e0c50a" }
netwatch = { git = "https://github.com/erlkonig-ai/net-tools.git", rev = "10ab7b328809103be74f6ca24258249715fae52b" }
# The pinned GORBIE source cohort provides resident PNG capture.
GORBIE = { path = "../GORBIE" }
# Match Mary's deterministic macro expansion and mixed-dtype matmul fixes.
# Cargo ignores a dependency's patch table, and Burn's workspace crates must
# stay on one source lineage to avoid resolving duplicate burn-tensor types.
cubecl-macros = { git = "https://github.com/erlkonig-ai/cubecl", rev = "8b2aa74e2514e39562df6e384a271c2ef9e53b06" }
burn = { git = "https://github.com/erlkonig-ai/burn", rev = "21adb25bb5277a1ff65179fa61442d8330d494d9" }
burn-autodiff = { git = "https://github.com/erlkonig-ai/burn", rev = "21adb25bb5277a1ff65179fa61442d8330d494d9" }
burn-backend = { git = "https://github.com/erlkonig-ai/burn", rev = "21adb25bb5277a1ff65179fa61442d8330d494d9" }
burn-core = { git = "https://github.com/erlkonig-ai/burn", rev = "21adb25bb5277a1ff65179fa61442d8330d494d9" }
burn-cubecl = { git = "https://github.com/erlkonig-ai/burn", rev = "21adb25bb5277a1ff65179fa61442d8330d494d9" }
burn-cubecl-fusion = { git = "https://github.com/erlkonig-ai/burn", rev = "21adb25bb5277a1ff65179fa61442d8330d494d9" }
burn-cuda = { git = "https://github.com/erlkonig-ai/burn", rev = "21adb25bb5277a1ff65179fa61442d8330d494d9" }
burn-dataset = { git = "https://github.com/erlkonig-ai/burn", rev = "21adb25bb5277a1ff65179fa61442d8330d494d9" }
burn-derive = { git = "https://github.com/erlkonig-ai/burn", rev = "21adb25bb5277a1ff65179fa61442d8330d494d9" }
burn-dispatch = { git = "https://github.com/erlkonig-ai/burn", rev = "21adb25bb5277a1ff65179fa61442d8330d494d9" }
burn-flex = { git = "https://github.com/erlkonig-ai/burn", rev = "21adb25bb5277a1ff65179fa61442d8330d494d9" }
burn-fusion = { git = "https://github.com/erlkonig-ai/burn", rev = "21adb25bb5277a1ff65179fa61442d8330d494d9" }
burn-ir = { git = "https://github.com/erlkonig-ai/burn", rev = "21adb25bb5277a1ff65179fa61442d8330d494d9" }
burn-ndarray = { git = "https://github.com/erlkonig-ai/burn", rev = "21adb25bb5277a1ff65179fa61442d8330d494d9" }
burn-nn = { git = "https://github.com/erlkonig-ai/burn", rev = "21adb25bb5277a1ff65179fa61442d8330d494d9" }
burn-optim = { git = "https://github.com/erlkonig-ai/burn", rev = "21adb25bb5277a1ff65179fa61442d8330d494d9" }
burn-rl = { git = "https://github.com/erlkonig-ai/burn", rev = "21adb25bb5277a1ff65179fa61442d8330d494d9" }
burn-std = { git = "https://github.com/erlkonig-ai/burn", rev = "21adb25bb5277a1ff65179fa61442d8330d494d9" }
burn-tensor = { git = "https://github.com/erlkonig-ai/burn", rev = "21adb25bb5277a1ff65179fa61442d8330d494d9" }
burn-train = { git = "https://github.com/erlkonig-ai/burn", rev = "21adb25bb5277a1ff65179fa61442d8330d494d9" }
burn-vision = { git = "https://github.com/erlkonig-ai/burn", rev = "21adb25bb5277a1ff65179fa61442d8330d494d9" }
burn-wgpu = { git = "https://github.com/erlkonig-ai/burn", rev = "21adb25bb5277a1ff65179fa61442d8330d494d9" }
cubecl-runtime = { path = "../cubecl-graph/cubecl-runtime" }
cubecl-cuda = { path = "../cubecl-graph/cubecl-cuda" }
cubecl-wgpu = { path = "../cubecl-graph/cubecl-wgpu" }
triblespace-core = { path = "../triblespace-rs/triblespace-core" }

# Debug info was 94.7% of a debug binary here: the `trible` test binary
# measured 1.97 GB, of which only 110 MB was code. Cargo never collects old
# hash-suffixed generations either, so that multiplied until one target/ tree
# reached 728 GB and filled the disk. `panicked at file.rs:12:3` comes from
# `#[track_caller]`, not DWARF, so it survives this; what goes is file:line
# inside RUST_BACKTRACE frames, and gdb locals.
[profile.dev]
debug = 0
