name: release

# Publish the registry packages first, then push the corresponding Faculties tag.
# Registry compilation has no sibling checkouts or source-only root patches.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  FACULTIES_VERSION: '0.21.0'
  MIGRATIONS_VERSION: '0.1.0'
  TRIBLE_VERSION: '0.47.0'
  CARGO_BUILD_JOBS: '2'
  CARGO_INCREMENTAL: '0'

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            os: macos-14
    steps:
      - name: Refuse non-tag or mismatched dispatch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_TYPE" = tag
          test "$GITHUB_REF" = "refs/tags/v$FACULTIES_VERSION"

      - name: Check out release tag for source and notices
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          path: faculties
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check tag versions and current default features
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C faculties rev-parse HEAD)" = "$(git -C faculties rev-parse "$GITHUB_REF^{commit}")"
          python - <<'PY'
          import os, pathlib, tomllib
          root = pathlib.Path('faculties')
          fac = tomllib.loads((root / 'Cargo.toml').read_text())
          mig = tomllib.loads((root / 'faculties-migrations/Cargo.toml').read_text())
          assert fac['package']['name'] == 'faculties'
          assert fac['package']['version'] == os.environ['FACULTIES_VERSION']
          assert mig['package']['version'] == os.environ['MIGRATIONS_VERSION']
          assert set(fac['features']['default']) == {'local-embed', 'widgets', 'audio', 'hear'}
          PY

      - name: Install native audio build headers on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libasound2-dev libudev-dev

      - name: Install pinned compiler
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: ${{ matrix.target }}, wasm32-unknown-unknown

      - name: Install exact registry binaries into temporary roots
        shell: bash
        env:
          CARGO_HOME: ${{ runner.temp }}/release-cargo-home
          CARGO_TARGET_DIR: ${{ runner.temp }}/release-target
        run: |
          set -euo pipefail
          # Explicitly spell today's defaults; no native WeMM/voice claim.
          cargo +1.98.0 install faculties --version "=$FACULTIES_VERSION" \
            --registry crates-io --locked --bins --no-default-features \
            --features local-embed,widgets,audio,hear --jobs "$CARGO_BUILD_JOBS" \
            --target '${{ matrix.target }}' --root "$RUNNER_TEMP/faculties-installed"
          cargo +1.98.0 install faculties-migrations --version "=$MIGRATIONS_VERSION" \
            --registry crates-io --locked --bin migrations --jobs "$CARGO_BUILD_JOBS" \
            --target '${{ matrix.target }}' --root "$RUNNER_TEMP/migrations-installed"
          cargo +1.98.0 install trible --version "=$TRIBLE_VERSION" \
            --registry crates-io --locked --bin trible --no-default-features \
            --features search,dashboard-gui --jobs "$CARGO_BUILD_JOBS" \
            --target '${{ matrix.target }}' --root "$RUNNER_TEMP/trible-installed"

      - name: Verify published source and lockfiles, then stage binaries
        shell: bash
        env:
          CARGO_HOME: ${{ runner.temp }}/release-cargo-home
        run: |
          set -euo pipefail
          python faculties/scripts/check-registry-release.py faculties "$CARGO_HOME"
          stage="faculties-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$stage"
          # cargo install installs executables, not these distribution notices.
          # The preceding check binds them to the exact downloaded archive.
          cp faculties/LICENSE-MIT faculties/LICENSE-APACHE faculties/README.md "$stage/"
          for bin in "$RUNNER_TEMP/faculties-installed/bin/"*; do
            test -f "$bin" && test -x "$bin"
            cp "$bin" "$stage/"
          done
          test -x "$RUNNER_TEMP/migrations-installed/bin/migrations"
          test -x "$RUNNER_TEMP/trible-installed/bin/trible"
          cp "$RUNNER_TEMP/migrations-installed/bin/migrations" "$stage/"
          cp "$RUNNER_TEMP/trible-installed/bin/trible" "$stage/"
          test -x "$stage/viewer"
          test -x "$stage/faculties"
          tar -czf "$stage.tar.gz" "$stage"
          shasum -a 256 "$stage.tar.gz" > "$stage.tar.gz.sha256"
          echo "STAGE_TARBALL=$stage.tar.gz" >> "$GITHUB_ENV"
          echo "STAGE_SHA256=$stage.tar.gz.sha256" >> "$GITHUB_ENV"

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.STAGE_TARBALL }}
            ${{ env.STAGE_SHA256 }}
          fail_on_unmatched_files: true

  publish-meta:
    name: release notes
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Generate notes
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_TYPE" = tag
          test "$GITHUB_REF" = "refs/tags/v$FACULTIES_VERSION"
          {
            echo '## Install'
            echo
            echo '### Precompiled (sandboxed environments)'
            echo '```sh'
            echo "curl -L https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/faculties-${GITHUB_REF_NAME}-aarch64-apple-darwin.tar.gz | tar -xz"
            echo 'export PATH="$PWD/faculties-'"${GITHUB_REF_NAME}"'-aarch64-apple-darwin:$PATH"'
            echo '```'
            echo
            echo '### Registry source builds'
            echo 'This archive was built from faculties 0.21.0, faculties-migrations 0.1.0, and trible 0.47.0 on crates.io, using their packaged lockfiles.'
            echo 'Faculties features: local-embed, widgets, audio, hear (the release defaults). Trible features: search, dashboard-gui. No source-cohort Git patches apply.'
            echo 'Native WeMM is NOT enabled in these portable binaries. It remains an opt-in `wemm` source build for the bounded CUDA/GB10 profile and its runtime/toolkit requirements; a full native macOS WeMM path is not released. `voice` and `discord-voice` are also not enabled.'
            echo 'See the tagged README for optional source-build features and deployment prerequisites.'
          } > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          append_body: true
